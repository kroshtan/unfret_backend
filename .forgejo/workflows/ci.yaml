name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' }}

jobs:
  # The public runner: an unprivileged throwaway container with no docker socket and no secrets.
  check:
    runs-on: kroshtan-public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: unfret
          POSTGRES_PASSWORD: unfret
          POSTGRES_DB: unfret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://github.com/astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Run pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Audit dependencies
        run: make audit
      - name: Run tests
        run: uv run pytest
        env:
          UNFRET_TEST_POSTGRES_URI: postgresql://unfret:unfret@postgres:5432/unfret
      - name: MCP server (mcp/, its own environment)
        run: |
          uv sync --project mcp --all-groups --frozen
          uv run --project mcp mypy mcp/src mcp/tests
          uv run --project mcp pytest mcp/tests

  # The deploy runner: its own rootless docker daemon to build on, and the deploy credentials as read-only files
  # under /creds. Only pushes to main (and manual runs on main) get here, and they deploy to DEV only:
  # dev.unfret.kroshtan.com on devnet. Production is never deployed from this workflow; see deploy-production.yaml
  # (manual, release tags only). The image built here is tagged with the commit SHA, and production later deploys
  # that same image.
  deploy-dev:
    needs: check
    if: forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main'
    runs-on: kroshtan-deploy
    concurrency:
      group: deploy-unfret-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the deploy credentials
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /creds/ssh_key ~/.ssh/id_ed25519
          install -m 644 /creds/known_hosts ~/.ssh/known_hosts
          value="$(cat /creds/KAMAL_REGISTRY_PASSWORD 2> /dev/null || true)"
          [[ -n "$value" ]] && echo "::add-mask::$value"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$value" >> "$FORGEJO_ENV"
      - name: Deploy to dev
        # Repo secrets prefixed DEV_ map onto the app's names in .kamal/secrets.dev (Settings → Actions → Secrets).
        # Optional ones may be unset: an empty secret keeps its feature off. The database accessory (unfret-dev-db)
        # is booted once, on the first deploy, and takes over the data of the dev database from before the rename.
        env:
          UNFRET_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          UNFRET_SESSION_SECRET: ${{ secrets.DEV_SESSION_SECRET }}
          UNFRET_HOT_WALLET_KEY: ${{ secrets.DEV_HOT_WALLET_KEY }}
          UNFRET_COLD_ADDRESS: ${{ secrets.DEV_COLD_ADDRESS }}
          UNFRET_ADMIN_TOKEN: ${{ secrets.DEV_ADMIN_TOKEN }}
          UNFRET_POLAR_ACCESS_TOKEN: ${{ secrets.DEV_POLAR_ACCESS_TOKEN }}
          UNFRET_POLAR_ENVIRONMENT: ${{ secrets.DEV_POLAR_ENVIRONMENT }}
          UNFRET_POLAR_PRODUCTS: ${{ secrets.DEV_POLAR_PRODUCTS }}
          UNFRET_FIAT_WEBHOOK_SECRET: ${{ secrets.DEV_FIAT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          [[ -n "$UNFRET_LLM_API_KEY" ]] || { echo "::error::repo secret LLM_API_KEY is not set"; exit 1; }
          [[ -n "$POSTGRES_PASSWORD" ]] || { echo "::error::repo secret DEV_POSTGRES_PASSWORD is not set"; exit 1; }
          # Build and push first: a failed build then leaves the running service alone.
          kamal build push -d dev
          # The scripts' plain ssh must not leave a known_hosts that Kamal's Net::SSH rejects (HostKeyMismatch).
          reset_known_hosts() { install -m 644 /creds/known_hosts ~/.ssh/known_hosts; }
          # Take dev's host off any other service (the one from before the rename) and stop that service.
          scripts/deploy/free-host.sh dev.unfret.kroshtan.com unfret-web-dev
          reset_known_hosts
          # `details` echoes its docker ps command (which names the container), so match a running row instead.
          if ! kamal accessory details db -d dev 2> /dev/null | grep -qE ' Up [0-9a-zA-Z]'; then
            kamal accessory boot db -d dev
          fi
          # One-time: copy the dev database from before the rename into the new, still empty one.
          scripts/deploy/adopt-db.sh veridex-dev-db unfret-dev-db
          reset_known_hosts
          kamal deploy -d dev --skip-push
      - name: Discard the deploy key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
