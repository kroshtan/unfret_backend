name: CI

on:
  push:
    branches: [main]
  # A pull request is checked once it is ready: not while its title starts with "WIP:" or "[WIP]" (a draft), and
  # dropping that prefix (an `edited` event; Forgejo has no `ready_for_review`) starts the run (README, "Pull
  # requests and CI").
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

# Forgejo applies `concurrency` to whole runs only (a job's own `concurrency` is ignored). A pull request's newer
# commit cancels its older run; an edit never cancels anything, it queues. On main, runs queue one behind the other
# and are never cancelled, so a deploy is never cut off or dropped; a superseded run skips its checks instead (check,
# "Still needed?").
concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.ref }}
  cancel-in-progress: ${{ forgejo.event_name == 'pull_request' && forgejo.event.action != 'edited' }}

jobs:
  # The public runner: an unprivileged throwaway container with no docker socket and no secrets.
  check:
    if: forgejo.event_name != 'pull_request' || !forgejo.event.pull_request.draft
    runs-on: kroshtan-public
    # A good run takes 5 to 9 minutes; a hang fails here instead of at the runner's 30-minute limit.
    timeout-minutes: 15
    outputs:
      checked: ${{ steps.gate.outputs.run }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: unfret
          POSTGRES_PASSWORD: unfret
          POSTGRES_DB: unfret
    steps:
      # Is this check still needed? (README, "Pull requests and CI".) On main, runs queue one behind the other,
      # and a run whose commit is no longer the branch's newest checks nothing: the newer commit's own run checks it.
      # On a pull request, an edit that leaves it ready (a new description or title) reports the result its commit
      # already has instead of checking it again; dropping "WIP:" (the commit has no result yet) runs the checks.
      - name: Still needed?
        id: gate
        env:
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
          EVENT: ${{ forgejo.event_name }}
          ACTION: ${{ forgejo.event.action }}
          SHA: ${{ forgejo.event.pull_request.head.sha || forgejo.sha }}
          BRANCH: ${{ forgejo.ref_name }}
          RUN: ${{ forgejo.run_number }}
          CONTEXT: CI / ${{ forgejo.job }} (pull_request)
        run: |
          python3 -I - <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          env = os.environ

          def get(path):
              # The repository is public: its branches and commit statuses need no token.
              with urllib.request.urlopen(env["API"] + path, timeout=30) as response:
                  return json.load(response)

          def decide(run, why):
              print(why)
              with open(env.get("FORGEJO_OUTPUT") or env["GITHUB_OUTPUT"], "a") as output:
                  output.write(f"run={run}\n")
              sys.exit()

          if env["EVENT"] in ("push", "workflow_dispatch"):
              tip = get("/branches/" + urllib.parse.quote(env["BRANCH"], safe=""))["commit"]["id"]
              if tip != env["SHA"]:
                  decide("false", f"::notice::superseded: {env['BRANCH']} is at {tip} now; that commit's run checks it")
          elif env["EVENT"] == "pull_request" and env["ACTION"] == "edited":
              statuses = get(f"/commits/{env['SHA']}/statuses?sort=highestindex&limit=50")
              earlier = [
                  s for s in statuses
                  if s["context"] == env["CONTEXT"] and f"/runs/{env['RUN']}/" not in (s["target_url"] or "")
              ]
              if earlier:
                  last = max(earlier, key=lambda s: s["id"])
                  if last["status"] == "success":
                      decide("false", f"::notice::this commit already passed: {last['target_url']}")
                  if last["status"] == "failure" and last["description"].startswith("Failing"):
                      print(f"::error::this commit already failed: {last['target_url']} (push a fix or re-run it)")
                      sys.exit(1)
          decide("true", "checking this commit")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: https://github.com/astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: steps.gate.outputs.run == 'true'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        run: uv sync --all-groups --frozen
      - name: Run pre-commit
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Audit dependencies
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        run: make audit
      - name: Run tests
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 10
        run: uv run pytest
        env:
          UNFRET_TEST_POSTGRES_URI: postgresql://unfret:unfret@postgres:5432/unfret
      - name: Run unit tests with the expansion classes on
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        run: make test-expansion
      - name: MCP server (mcp/, its own environment)
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 5
        run: |
          uv sync --project mcp --all-groups --frozen
          uv run --project mcp mypy mcp/src mcp/tests
          uv run --project mcp pytest mcp/tests

  # The deploy runner: its own rootless docker daemon to build on, and the deploy credentials as read-only files
  # under /creds. Only pushes to main (and manual runs on main) get here, and they deploy to DEV only:
  # dev.unfret.net on devnet. Production is never deployed from this workflow; see deploy-production.yaml
  # (manual, release tags only). The image built here is tagged with the commit SHA, and production later deploys
  # that same image.
  deploy-dev:
    needs: check
    # Only a commit whose own checks ran and passed: a superseded run checks nothing, and the newer commit's run
    # deploys instead.
    if: >-
      forgejo.event_name != 'pull_request' && forgejo.ref == 'refs/heads/main'
      && needs.check.outputs.checked == 'true'
    runs-on: kroshtan-deploy
    concurrency:
      group: deploy-unfret-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load the deploy credentials
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /creds/ssh_key ~/.ssh/id_ed25519
          install -m 644 /creds/known_hosts ~/.ssh/known_hosts
          value="$(cat /creds/KAMAL_REGISTRY_PASSWORD 2> /dev/null || true)"
          [[ -n "$value" ]] && echo "::add-mask::$value"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$value" >> "$FORGEJO_ENV"
      - name: Deploy to dev
        # Repo secrets prefixed DEV_ map onto the app's names in .kamal/secrets.dev (Settings → Actions → Secrets).
        # Optional ones may be unset: an empty secret keeps its feature off. The database accessory (unfret-dev-db)
        # is booted once, on the first deploy, and takes over the data of the dev database from before the rename.
        env:
          # Baked into the image (Dockerfile ARG, config/deploy.yml builder.args) and shown by /v1/health as
          # `commit`; the production deploy waits for dev to report the release's commit before its e2e sweep.
          GIT_SHA: ${{ forgejo.sha }}
          UNFRET_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.DEV_POSTGRES_PASSWORD }}
          UNFRET_SESSION_SECRET: ${{ secrets.DEV_SESSION_SECRET }}
          UNFRET_HOT_WALLET_KEY: ${{ secrets.DEV_HOT_WALLET_KEY }}
          UNFRET_COLD_ADDRESS: ${{ secrets.DEV_COLD_ADDRESS }}
          UNFRET_ADMIN_TOKEN: ${{ secrets.DEV_ADMIN_TOKEN }}
          UNFRET_POLAR_ACCESS_TOKEN: ${{ secrets.DEV_POLAR_ACCESS_TOKEN }}
          UNFRET_POLAR_ENVIRONMENT: ${{ secrets.DEV_POLAR_ENVIRONMENT }}
          UNFRET_POLAR_PRODUCTS: ${{ secrets.DEV_POLAR_PRODUCTS }}
          UNFRET_FIAT_WEBHOOK_SECRET: ${{ secrets.DEV_FIAT_WEBHOOK_SECRET }}
          # Read-only access to the private model store (README, "The model"); unset: the open baseline scorer.
          MODEL_READ_TOKEN: ${{ secrets.MODEL_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$UNFRET_LLM_API_KEY" ]] || { echo "::error::repo secret LLM_API_KEY is not set"; exit 1; }
          [[ -n "$POSTGRES_PASSWORD" ]] || { echo "::error::repo secret DEV_POSTGRES_PASSWORD is not set"; exit 1; }
          # The scorer: the model store's current release, or the baseline (fetched before anything changes).
          scorer="$RUNNER_TEMP/scorer"
          scripts/private-model.sh fetch "$scorer"
          # Build and push first: a failed build then leaves the running service alone.
          kamal build push -d dev
          # `details` echoes its docker ps command (which names the container), so match a running row instead.
          if ! kamal accessory details db -d dev 2> /dev/null | grep -qE ' Up [0-9a-zA-Z]'; then
            kamal accessory boot db -d dev
          fi
          scripts/private-model.sh install dev "$scorer"
          while read -r line; do export "$line"; done < <(scripts/private-model.sh env "$scorer")
          kamal deploy -d dev --skip-push
          # The production deploy runs the release dev runs, so dev must report exactly these versions.
          scripts/private-model.sh verify https://dev.unfret.net "$scorer"
      - name: Discard the deploy key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
