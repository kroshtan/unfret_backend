name: Deploy production

# Production (unfret.kroshtan.com, Solana MAINNET) is deployed only by hand: Actions → "Deploy production" → Run
# workflow. Nothing deploys here automatically. Leave the input at `main` to release main's newest commit: it is tagged
# v<version in pyproject.toml> (refused if that tag already names another commit, so bump the version first). Or give
# an existing release tag, e.g. v0.7.0, to deploy that release again. Either way the workflow refuses unless the
# commit is on main, its CI passed and the SAME commit was deployed to dev successfully, and dev, running that commit,
# passes the end-to-end sweep (tests/e2e, devnet only); then it deploys the exact image dev ran (tagged with the
# commit SHA): it never rebuilds.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "main (release main's newest commit) or an existing release tag such as v0.7.0"
        required: true
        default: main
        type: string

concurrency:
  group: deploy-unfret-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: kroshtan-deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Check the release
        id: release
        env:
          REF: ${{ inputs.ref }}
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
        run: |
          set -euo pipefail
          git fetch -q --tags origin main
          if [[ "$REF" == main ]]; then
            sha="$(git rev-parse origin/main)"
            version="$(sed -nE 's/^version = "([^"]+)"$/\1/p' pyproject.toml | head -n 1)"
            tag="v$version"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::pyproject.toml version '$version' is not a release version"; exit 1; }
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              [[ "$(git rev-parse "$tag^{commit}")" == "$sha" ]] \
                || { echo "::error::$tag already names another commit: bump the version (make bump) first"; exit 1; }
              echo "new_tag=" >> "$FORGEJO_OUTPUT"
            else
              echo "new_tag=$tag" >> "$FORGEJO_OUTPUT"
            fi
          else
            tag="$REF"
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]] \
              || { echo "::error::'$tag' is not main or a release tag like v0.7.0"; exit 1; }
            git rev-parse -q --verify "refs/tags/$tag" > /dev/null \
              || { echo "::error::tag $tag does not exist"; exit 1; }
            sha="$(git rev-parse "$tag^{commit}")"
            echo "new_tag=" >> "$FORGEJO_OUTPUT"
          fi
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "::error::$tag ($sha) is not on main"; exit 1; }
          # The repository is public, so its commit statuses can be read without a token.
          curl -fsS "$API/commits/$sha/status" | ruby -rjson -e '
            statuses = JSON.parse($stdin.read).fetch("statuses", []).to_h { |s| [s["context"], s["status"]] }
            need = ["CI / check (push)", "CI / deploy-dev (push)"]
            bad = need.reject { |c| statuses[c] == "success" }
            abort("::error::not green on main/dev for this commit: " + bad.map { |c| "#{c}=#{statuses[c] || "missing"}" }.join(", ")) unless bad.empty?
            puts "check and deploy-dev succeeded for this commit"'
          echo "sha=$sha" >> "$FORGEJO_OUTPUT"
          echo "tag=$tag" >> "$FORGEJO_OUTPUT"
          echo "Deploying $tag ($sha) to production"
      # ── Gate: the end-to-end sweep (tests/e2e) on dev, running this very commit. Nothing is tagged or deployed
      # unless it passes. It spends only devnet test money (the DEV_E2E_PAYER_KEY wallet) and refuses to run against
      # anything that says mainnet.
      - uses: https://github.com/astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Load the deploy credentials
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          install -m 600 /creds/ssh_key ~/.ssh/id_ed25519
          install -m 644 /creds/known_hosts ~/.ssh/known_hosts
          value="$(cat /creds/KAMAL_REGISTRY_PASSWORD 2> /dev/null || true)"
          [[ -n "$value" ]] && echo "::add-mask::$value"
          printf 'KAMAL_REGISTRY_PASSWORD=%s\n' "$value" >> "$FORGEJO_ENV"
      - name: Wait for dev to run the release
        env:
          SHA: ${{ steps.release.outputs.sha }}
          NEW_TAG: ${{ steps.release.outputs.new_tag }}
          DEV: https://dev.unfret.kroshtan.com
        run: |
          set -euo pipefail
          # The sweep tests the checked-out code against dev; both must be the release.
          [[ "$(git rev-parse HEAD)" == "$SHA" ]] \
            || { echo "::error::the checkout ($(git rev-parse HEAD)) is not the release ($SHA): main moved, run again"; exit 1; }
          running() { curl -fsS -m 10 "$DEV/v1/health" | ruby -rjson -e 'print JSON.parse($stdin.read)["commit"].to_s' || true; }
          # deploy-dev already succeeded for this commit, so dev serves it within a minute or two (kamal-proxy switches
          # over once the new container is ready). A release deployed again (an older tag) is no longer on dev.
          deadline=$((SECONDS + 600))
          until [[ "$(running)" == "$SHA" ]]; do
            if [[ -z "$NEW_TAG" && "$(git rev-parse origin/main)" != "$SHA" ]]; then
              echo "::error::dev runs $(running), not $SHA: the e2e sweep needs dev to run the release (README, 'Rolling back production')"
              exit 1
            fi
            ((SECONDS < deadline)) || { echo "::error::dev still runs $(running), not $SHA, after 10 minutes"; exit 1; }
            sleep 10
          done
          echo "dev runs $SHA"
      - name: End-to-end sweep on dev
        timeout-minutes: 15
        env:
          UNFRET_E2E_URL: https://dev.unfret.kroshtan.com
          UNFRET_E2E_COMMIT: ${{ steps.release.outputs.sha }}
          UNFRET_E2E_PAYER_KEY: ${{ secrets.DEV_E2E_PAYER_KEY }}
          UNFRET_E2E_KEY: ${{ secrets.DEV_E2E_KEY }}
          UNFRET_E2E_ADMIN_TOKEN: ${{ secrets.DEV_ADMIN_TOKEN }}
          UNFRET_E2E_FIAT_WEBHOOK_SECRET: ${{ secrets.DEV_FIAT_WEBHOOK_SECRET }}
          UNFRET_E2E_POLAR_PRODUCTS: ${{ secrets.DEV_POLAR_PRODUCTS }}
          DEV_POLAR_ENVIRONMENT: ${{ secrets.DEV_POLAR_ENVIRONMENT }}
          # Search dev's logs and database for the run's marker (the deploy key loaded above); a skipped part fails.
          UNFRET_E2E_SSH: kamal@git.kroshtan.com
          UNFRET_E2E_NO_SKIP: "1"
        run: |
          set -euo pipefail
          missing=()
          for name in UNFRET_E2E_PAYER_KEY UNFRET_E2E_KEY UNFRET_E2E_ADMIN_TOKEN; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          ((${#missing[@]} == 0)) || { echo "::error::e2e settings not set (repo secrets DEV_E2E_PAYER_KEY, DEV_E2E_KEY, DEV_ADMIN_TOKEN): ${missing[*]}"; exit 1; }
          # Card top-ups are checked as dev has them: on (Polar, in DEV_POLAR_ENVIRONMENT) when their secrets are set.
          if [[ -n "$UNFRET_E2E_POLAR_PRODUCTS" && -n "$UNFRET_E2E_FIAT_WEBHOOK_SECRET" ]]; then
            export UNFRET_E2E_EXPECT_FIAT="polar:${DEV_POLAR_ENVIRONMENT:-sandbox}"
          else
            export UNFRET_E2E_EXPECT_FIAT=off
          fi
          uv sync --frozen
          uv run pytest -m e2e tests/e2e -x --no-cov -p no:cacheprovider -v
      - name: Tag the release
        if: steps.release.outputs.new_tag != ''
        env:
          TAG: ${{ steps.release.outputs.new_tag }}
          SHA: ${{ steps.release.outputs.sha }}
          TOKEN: ${{ forgejo.token }}
          API: ${{ forgejo.server_url }}/api/v1/repos/${{ forgejo.repository }}
        run: |
          set -euo pipefail
          body="$(ruby -rjson -e 'puts JSON.generate(tag_name: ENV["TAG"], target: ENV["SHA"], message: "Release #{ENV["TAG"]}")')"
          curl -fsS -o /dev/null -X POST -H "Authorization: token $TOKEN" -H "Content-Type: application/json" \
            -d "$body" "$API/tags" && echo "tagged $TAG" \
            || echo "::warning::could not create tag $TAG (the deploy goes ahead); tag $SHA by hand"
      - name: Deploy to production
        # Repo secrets prefixed PROD_ map onto the app's names in .kamal/secrets.production. Every one is required:
        # production never starts with a feature silently off or pointing at the wrong network.
        env:
          SHA: ${{ steps.release.outputs.sha }}
          UNFRET_LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.PROD_POSTGRES_PASSWORD }}
          UNFRET_SOLANA_RPC_URL: ${{ secrets.PROD_SOLANA_RPC_URL }}
          UNFRET_SESSION_SECRET: ${{ secrets.PROD_SESSION_SECRET }}
          UNFRET_HOT_WALLET_KEY: ${{ secrets.PROD_HOT_WALLET_KEY }}
          UNFRET_COLD_ADDRESS: ${{ secrets.PROD_COLD_ADDRESS }}
          UNFRET_ADMIN_TOKEN: ${{ secrets.PROD_ADMIN_TOKEN }}
          # Card top-ups (Polar): all three or none.
          UNFRET_POLAR_ACCESS_TOKEN: ${{ secrets.PROD_POLAR_ACCESS_TOKEN }}
          UNFRET_POLAR_PRODUCTS: ${{ secrets.PROD_POLAR_PRODUCTS }}
          UNFRET_FIAT_WEBHOOK_SECRET: ${{ secrets.PROD_FIAT_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          missing=()
          for name in UNFRET_LLM_API_KEY POSTGRES_PASSWORD UNFRET_SOLANA_RPC_URL UNFRET_SESSION_SECRET \
            UNFRET_HOT_WALLET_KEY UNFRET_COLD_ADDRESS UNFRET_ADMIN_TOKEN; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          ((${#missing[@]} == 0)) || { echo "::error::production secrets not set: ${missing[*]}"; exit 1; }
          polar=0
          for name in UNFRET_POLAR_ACCESS_TOKEN UNFRET_POLAR_PRODUCTS UNFRET_FIAT_WEBHOOK_SECRET; do
            [[ -n "${!name}" ]] && polar=$((polar + 1))
          done
          ((polar == 0 || polar == 3)) \
            || { echo "::error::set all of PROD_POLAR_ACCESS_TOKEN, PROD_POLAR_PRODUCTS, PROD_FIAT_WEBHOOK_SECRET, or none"; exit 1; }
          ((polar == 3)) && echo "card top-ups: on (Polar production)" || echo "card top-ups: off (no PROD_POLAR_* secrets)"
          [[ "$UNFRET_SOLANA_RPC_URL" != *devnet* && "$UNFRET_SOLANA_RPC_URL" != *testnet* ]] \
            || { echo "::error::PROD_SOLANA_RPC_URL points at a test network"; exit 1; }
          # `details` echoes its docker ps command (which names the container), so match a running row instead.
          if ! kamal accessory details db -d production 2> /dev/null | grep -qE ' Up [0-9a-zA-Z]'; then
            kamal accessory boot db -d production
          fi
          # --skip-push pulls the image dev built for this commit instead of building one; --version pins it.
          kamal deploy -d production --skip-push --version "$SHA"
      - name: Discard the deploy key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
