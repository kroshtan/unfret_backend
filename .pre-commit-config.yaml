repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        # The vendored EU Safety Gate index (~1.7 MB, refreshed monthly by make safety-gate) and the x402 examples'
        # lock file (the official SDK's EVM extra pulls in web3) are the exceptions.
        exclude: ^(src/unfret/safety_gate_index\.json\.gz|examples/python/uv\.lock)$
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key

  # Linters run from the project environment so versions match uv.lock and
  # mypy sees the real third-party type information.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --exit-non-zero-on-fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src tests evals
        language: system
        types: [python]
        pass_filenames: false
      - id: pydoclint
        name: pydoclint
        entry: uv run pydoclint src evals
        language: system
        types: [python]
        pass_filenames: false
      # The scorer in src/unfret/scoring/ is the open baseline; retrained scorers stay out of the repository.
      - id: check-scorer-baseline
        name: no retrained scorer in the repository
        entry: uv run python scripts/check_scorer_baseline.py
        language: system
        files: \.json$
        always_run: true
