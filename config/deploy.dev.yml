# dev: dev.unfret.net on Solana devnet (test money only). Deployed automatically by CI on every push to
# main (.forgejo/workflows/ci.yaml, job deploy-dev). Secrets: .kamal/secrets-common + .kamal/secrets.dev, fed from
# the DEV_* repo secrets.
proxy:
  hosts:
    - dev.unfret.net

env:
  clear:
    UNFRET_LLM_BASE_URL: https://api.scaleway.ai/v1
    UNFRET_LLM_MODEL: mistral-small-3.2-24b-instruct-2506
    UNFRET_SOLANA_NETWORK: solana-devnet
    UNFRET_SOLANA_RPC_URL: https://api.devnet.solana.com
    UNFRET_X402_ALLOW_MAINNET: "false"
    UNFRET_SIWS_DOMAIN: dev.unfret.net
    UNFRET_PUBLIC_BASE_URL: https://dev.unfret.net
  secret:
    - UNFRET_LLM_API_KEY
    - UNFRET_POSTGRES_URI
    # Optional: each feature stays off (503 / skipped) while its secret is empty.
    - UNFRET_SESSION_SECRET  # sign-in and credits
    - UNFRET_HOT_WALLET_KEY  # x402 + credit purchases (fee payer and receiver); a devnet-only key
    - UNFRET_COLD_ADDRESS  # sweep destination
    - UNFRET_ADMIN_TOKEN  # optional: operator endpoints (clear x402 alerts, readiness details)
    # Optional: card top-ups for API keys through Polar, off unless the token, products and webhook secret are all
    # set. The environment (sandbox | production) is a secret too, so it's chosen with the token, not here.
    - UNFRET_POLAR_ACCESS_TOKEN
    - UNFRET_POLAR_ENVIRONMENT
    - UNFRET_POLAR_PRODUCTS
    - UNFRET_FIAT_WEBHOOK_SECRET

accessories:
  # Reached by the app as unfret-dev-db on the `kamal` network; never published. forge-infra's nightly backup
  # pg_dumps it (APP_PG in backup/forge-backup.sh).
  db:
    # Its own container name (unfret-dev-db): both destinations' accessories share one host and service.
    service: unfret-dev-db
    image: postgres:17-alpine
    host: git.kroshtan.com
    env:
      clear:
        POSTGRES_USER: unfret
        POSTGRES_DB: unfret
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      memory: 512m
      cpus: 1
