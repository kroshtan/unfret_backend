# dev: dev.unfret.net on Solana devnet (test money only). Deployed automatically by CI on every push to
# main (.forgejo/workflows/ci.yaml, job deploy-dev). Secrets: .kamal/secrets-common + .kamal/secrets.dev, fed from
# the DEV_* repo secrets.
proxy:
  hosts:
    - dev.unfret.net

env:
  clear:
    UNFRET_LLM_BASE_URL: https://api.scaleway.ai/v1
    UNFRET_LLM_MODEL: mistral-small-3.2-24b-instruct-2506
    UNFRET_SOLANA_NETWORK: solana-devnet
    UNFRET_SOLANA_RPC_URL: https://api.devnet.solana.com
    UNFRET_X402_ALLOW_MAINNET: "false"
    UNFRET_SIWS_DOMAIN: dev.unfret.net
    UNFRET_PUBLIC_BASE_URL: https://dev.unfret.net
    # The page classes beyond products (p2p ads, service providers): on in dev and production.
    UNFRET_EXPANSION_CLASSES: "true"
    # Dev's first cold address (the old treasury), swept to until 16 Nov 2026 05:50 UTC; DEV_COLD_ADDRESS is now the
    # e2e payer (a closed loop on devnet). The outflow audit accepts sweeps to it before the cut-off, nothing after.
    UNFRET_FORMER_COLD_ADDRESSES: EE6XVrpkxrxDx6T9TRyFwrEB2D35kWJzHBgMn4jwzeJe
    UNFRET_FORMER_COLD_UNTIL: "2026-11-16T06:00:00Z"
    # The scorer: a retrained one from the private model store when the deploy workflow installed one into the
    # mounted directory below (scripts/private-model.sh), else empty: the open baseline in the image.
    UNFRET_MODEL_PATH: "<%= ENV.fetch('UNFRET_MODEL_PATH', '') %>"
    UNFRET_MODEL_QUICK_PATH: "<%= ENV.fetch('UNFRET_MODEL_QUICK_PATH', '') %>"
    # x402 in USDC on Base Sepolia (testnet), off until DEV_BASE_HOT_KEY, DEV_BASE_COLD_ADDRESS and the facilitator's
    # key exist (README, "USDC on Base"); then this flips to "true" in a PR. Mainnet stays refused here. After a change
    # of DEV_BASE_COLD_ADDRESS the old one goes here, public: UNFRET_BASE_FORMER_COLD_ADDRESSES and
    # UNFRET_BASE_FORMER_COLD_UNTIL (README, "Changing the Base cold address").
    UNFRET_X402_BASE_ENABLED: "false"
    UNFRET_BASE_NETWORK: base-sepolia
    # OAuth sign-in for the remote MCP server (/mcp, unfret.oauth), for Claude's connector directory: on in dev.
    UNFRET_MCP_OAUTH_ENABLED: "true"
    UNFRET_X402_BASE_ALLOW_MAINNET: "false"
  secret:
    - UNFRET_LLM_API_KEY
    - UNFRET_POSTGRES_URI
    # Optional: each feature stays off (503 / skipped) while its secret is empty.
    - UNFRET_SESSION_SECRET  # sign-in and credits
    - UNFRET_HOT_WALLET_KEY  # x402 + credit purchases (fee payer and receiver); a devnet-only key
    - UNFRET_COLD_ADDRESS  # sweep destination
    - UNFRET_ADMIN_TOKEN  # optional: operator endpoints (clear x402 alerts, readiness details)
    # Optional: card top-ups for API keys through Polar, off unless the token, products and webhook secret are all
    # set. The environment (sandbox | production) is a secret too, so it's chosen with the token, not here.
    - UNFRET_POLAR_ACCESS_TOKEN
    - UNFRET_POLAR_ENVIRONMENT
    - UNFRET_POLAR_PRODUCTS
    - UNFRET_FIAT_WEBHOOK_SECRET
    # Optional: x402 on Base Sepolia (off while UNFRET_X402_BASE_ENABLED is "false" above). The hot key is payTo's
    # key (a Sepolia-only key holding a little Sepolia ETH for the sweeps' gas); the cold address and the optional
    # payTo check are public; the CDP API key is the facilitator's credential (Ed25519 secret).
    - UNFRET_X402_BASE_HOT_KEY
    - UNFRET_BASE_PAY_TO
    - UNFRET_BASE_COLD_ADDRESS
    - UNFRET_CDP_API_KEY_ID
    - UNFRET_CDP_API_KEY_SECRET

# Retrained scorers never go into the image (built from the public repository): the deploy workflow puts the release
# it fetched from the private model store here on the server, read-only in the container (README, "The model").
volumes:
  - /home/kamal/unfret-model/dev:/app/private-model:ro

accessories:
  # Reached by the app as unfret-dev-db on the `kamal` network; never published. forge-infra's nightly backup
  # pg_dumps it (APP_PG in backup/forge-backup.sh).
  db:
    # Its own container name (unfret-dev-db): both destinations' accessories share one host and service.
    service: unfret-dev-db
    image: postgres:17-alpine
    host: git.kroshtan.com
    env:
      clear:
        POSTGRES_USER: unfret
        POSTGRES_DB: unfret
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      memory: 512m
      cpus: 1
