# production: unfret.net on Solana MAINNET (real money). Deployed ONLY by hand, through the
# deploy-production workflow (.forgejo/workflows/deploy-production.yaml), for a release tag whose exact image already
# ran on dev. Secrets: .kamal/secrets-common + .kamal/secrets.production, fed from the PROD_* repo secrets.
# Its database (unfret-prod-db) is its own: devnet balances and scan cursors never reach mainnet.
proxy:
  hosts:
    - unfret.net
    # The old name, until the forge's Caddy redirects it to unfret.net (forge-infra); then remove it.
    - unfret.kroshtan.com

env:
  clear:
    UNFRET_LLM_BASE_URL: https://api.scaleway.ai/v1
    UNFRET_LLM_MODEL: mistral-small-3.2-24b-instruct-2506
    UNFRET_SOLANA_NETWORK: solana-mainnet
    UNFRET_X402_ALLOW_MAINNET: "true"
    UNFRET_SIWS_DOMAIN: unfret.net
    UNFRET_PUBLIC_BASE_URL: https://unfret.net
    UNFRET_POLAR_ENVIRONMENT: production  # real money; production never talks to Polar's sandbox
  secret:
    - UNFRET_LLM_API_KEY
    - UNFRET_POSTGRES_URI
    - UNFRET_SOLANA_RPC_URL  # a mainnet RPC provider (the public endpoint is rate-limited)
    - UNFRET_SESSION_SECRET
    - UNFRET_HOT_WALLET_KEY  # the mainnet hot wallet (fee payer and receiver)
    - UNFRET_COLD_ADDRESS  # the cold wallet (sweep destination)
    - UNFRET_ADMIN_TOKEN  # optional: operator endpoints (clear x402 alerts, readiness details)
    # Card top-ups through Polar: all three or none (the deploy refuses a partial set); off while empty.
    - UNFRET_POLAR_ACCESS_TOKEN
    - UNFRET_POLAR_PRODUCTS
    - UNFRET_FIAT_WEBHOOK_SECRET

accessories:
  # Reached by the app as unfret-prod-db on the `kamal` network; never published. forge-infra's nightly backup
  # pg_dumps it (APP_PG in backup/forge-backup.sh). It holds customers' balances.
  db:
    # Its own container name (unfret-prod-db): both destinations' accessories share one host and service.
    service: unfret-prod-db
    image: postgres:17-alpine
    host: git.kroshtan.com
    env:
      clear:
        POSTGRES_USER: unfret
        POSTGRES_DB: unfret
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      memory: 512m
      cpus: 1
