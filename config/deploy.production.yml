# production: veridex.kroshtan.com on Solana MAINNET (real money). Deployed ONLY by hand, through the
# deploy-production workflow (.forgejo/workflows/deploy-production.yaml), for a release tag whose exact image already
# ran on dev. Secrets: .kamal/secrets-common + .kamal/secrets.production, fed from the PROD_* repo secrets.
# Its database (veridex-prod-db) is its own and starts empty: devnet balances and scan cursors never reach mainnet.
service: veridex-prod

proxy:
  hosts:
    - veridex.kroshtan.com

env:
  clear:
    VERIDEX_LLM_BASE_URL: https://api.scaleway.ai/v1
    VERIDEX_LLM_MODEL: mistral-small-3.2-24b-instruct-2506
    VERIDEX_SOLANA_NETWORK: solana-mainnet
    VERIDEX_X402_ALLOW_MAINNET: "true"
    VERIDEX_SIWS_DOMAIN: veridex.kroshtan.com
    VERIDEX_PUBLIC_BASE_URL: https://veridex.kroshtan.com
  secret:
    - VERIDEX_LLM_API_KEY
    - VERIDEX_POSTGRES_URI
    - VERIDEX_SOLANA_RPC_URL  # a mainnet RPC provider (the public endpoint is rate-limited)
    - VERIDEX_SESSION_SECRET
    - VERIDEX_HOT_WALLET_KEY  # the mainnet hot wallet (fee payer and receiver)
    - VERIDEX_COLD_ADDRESS  # the cold wallet (sweep destination)
    - VERIDEX_ADMIN_TOKEN  # optional: operator endpoints (clear x402 alerts, readiness details)

accessories:
  # Reached by the app as veridex-prod-db on the `kamal` network; never published. forge-infra's nightly backup
  # pg_dumps it (APP_PG in backup/forge-backup.sh). It holds customers' balances.
  db:
    image: postgres:17-alpine
    host: git.kroshtan.com
    env:
      clear:
        POSTGRES_USER: veridex
        POSTGRES_DB: veridex
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      memory: 512m
      cpus: 1
