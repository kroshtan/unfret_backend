# production: unfret.net on Solana MAINNET (real money). Deployed ONLY by hand, through the
# deploy-production workflow (.forgejo/workflows/deploy-production.yaml), for a release tag whose exact image already
# ran on dev. Secrets: .kamal/secrets-common + .kamal/secrets.production, fed from the PROD_* repo secrets.
# Its database (unfret-prod-db) is its own: devnet balances and scan cursors never reach mainnet.
proxy:
  hosts:
    - unfret.net

env:
  clear:
    UNFRET_LLM_BASE_URL: https://api.scaleway.ai/v1
    UNFRET_LLM_MODEL: mistral-small-3.2-24b-instruct-2506
    UNFRET_SOLANA_NETWORK: solana-mainnet
    UNFRET_X402_ALLOW_MAINNET: "true"
    UNFRET_SIWS_DOMAIN: unfret.net
    UNFRET_PUBLIC_BASE_URL: https://unfret.net
    UNFRET_POLAR_ENVIRONMENT: production  # real money; production never talks to Polar's sandbox
    # The page classes beyond products (p2p ads, service providers): on in dev and production.
    UNFRET_EXPANSION_CLASSES: "true"
    # OAuth sign-in for the remote MCP server (/mcp, unfret.oauth; Claude's connector directory). Off: /mcp takes
    # Bearer ufk_ passes only. Turning it on is this one line, "true", in a release.
    UNFRET_MCP_OAUTH_ENABLED: "false"
    # The scorer: a retrained one from the private model store when the deploy workflow installed one into the
    # mounted directory below (scripts/private-model.sh), else empty: the open baseline in the image.
    UNFRET_MODEL_PATH: "<%= ENV.fetch('UNFRET_MODEL_PATH', '') %>"
    UNFRET_MODEL_QUICK_PATH: "<%= ENV.fetch('UNFRET_MODEL_QUICK_PATH', '') %>"
    # x402 in USDC on Base MAINNET (real money), OFF until PROD_BASE_HOT_KEY, PROD_BASE_COLD_ADDRESS and the CDP key
    # (PROD_CDP_API_KEY_ID / _SECRET) exist (README, "USDC on Base"); then this flips to "true" in a PR. The
    # facilitator is Coinbase's (CDP, the default UNFRET_BASE_FACILITATOR_URL). After a change of
    # PROD_BASE_COLD_ADDRESS the old one goes here, public: UNFRET_BASE_FORMER_COLD_ADDRESSES and
    # UNFRET_BASE_FORMER_COLD_UNTIL (README, "Changing the Base cold address").
    UNFRET_X402_BASE_ENABLED: "false"
    UNFRET_BASE_NETWORK: base-mainnet
    UNFRET_X402_BASE_ALLOW_MAINNET: "true"
  secret:
    - UNFRET_LLM_API_KEY
    - UNFRET_POSTGRES_URI
    - UNFRET_SOLANA_RPC_URL  # a mainnet RPC provider (the public endpoint is rate-limited)
    - UNFRET_SESSION_SECRET
    - UNFRET_HOT_WALLET_KEY  # the mainnet hot wallet (fee payer and receiver)
    - UNFRET_COLD_ADDRESS  # the cold wallet (sweep destination)
    - UNFRET_ADMIN_TOKEN  # optional: operator endpoints (clear x402 alerts, readiness details)
    # Card top-ups through Polar: all three or none (the deploy refuses a partial set); off while empty.
    - UNFRET_POLAR_ACCESS_TOKEN
    - UNFRET_POLAR_TOPUP_PRODUCT
    - UNFRET_FIAT_WEBHOOK_SECRET
    # x402 on Base mainnet (off while UNFRET_X402_BASE_ENABLED is "false" above): the hot key (payTo's key, holding a
    # little ETH on Base for the sweeps' gas), the optional payTo check, the cold address (Floris's own wallet; the
    # server never holds its key), the CDP API key (Ed25519) and a provider's Base RPC (optional; the public one is
    # rate-limited). Once Base is enabled the deploy refuses to run without the hot key, cold address and CDP key.
    - UNFRET_X402_BASE_HOT_KEY
    - UNFRET_BASE_PAY_TO
    - UNFRET_BASE_COLD_ADDRESS
    - UNFRET_CDP_API_KEY_ID
    - UNFRET_CDP_API_KEY_SECRET
    - UNFRET_BASE_RPC_URL

# Retrained scorers never go into the image (built from the public repository): the deploy workflow puts the release
# it fetched from the private model store here on the server, read-only in the container (README, "The model").
volumes:
  - /home/kamal/unfret-model/production:/app/private-model:ro

accessories:
  # Reached by the app as unfret-prod-db on the `kamal` network; never published. forge-infra's nightly backup
  # pg_dumps it (APP_PG in backup/forge-backup.sh). It holds customers' balances.
  db:
    # Its own container name (unfret-prod-db): both destinations' accessories share one host and service.
    service: unfret-prod-db
    image: postgres:17-alpine
    host: git.kroshtan.com
    env:
      clear:
        POSTGRES_USER: unfret
        POSTGRES_DB: unfret
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
    options:
      memory: 512m
      cpus: 1
