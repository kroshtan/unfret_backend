# Kamal: the parts both environments share. Deploy with a destination, never without one:
#   dev         config/deploy.dev.yml         dev.unfret.net, Solana devnet, auto-deployed on every push to main
#   production  config/deploy.production.yml  unfret.net, Solana mainnet, deployed by hand (deploy-production)
# Kamal deep-merges the destination file over this one (arrays are replaced, not merged), so each destination
# declares its own proxy host, env and database accessory. The service is one for both: Kamal names the containers
# unfret-web-dev-<sha> / unfret-web-production-<sha> (kamal-proxy services unfret-web-dev / unfret-web-production),
# and the image dev built carries the label service=unfret that a production deploy of it checks for. Both run on the
# same box and behind the same Caddy + kamal-proxy as kroshtan-web (forge-infra README, "Adding an app"); kamal-proxy
# only switches traffic over once the new container passes its readiness check.
service: unfret
# Kamal prefixes registry.server itself; a host here would make it git.kroshtan.com/git.kroshtan.com/….
# One image for both destinations, tagged with the commit SHA: production deploys the exact image dev ran.
image: kroshtan/unfret

servers:
  web:
    hosts:
      # The forge's own name: it resolves straight to the server (not through Cloudflare), so SSH reaches it.
      - git.kroshtan.com
    # The app writes nothing to disk and needs no privileges.
    options:
      read-only: true
      tmpfs: /tmp
      cap-drop: ALL
      security-opt: no-new-privileges:true
      memory: 1536m
      cpus: 1
      pids-limit: 512

ssh:
  # A deploy-only account on the server; its only key is the deploy runner's.
  user: kamal

proxy:
  # Caddy owns 80/443 on the server and terminates TLS. kamal-proxy runs behind it on the `kamal` network,
  # unpublished, and routes plain HTTP by Host header (hosts: per destination).
  run:
    publish: false
  ssl: false
  app_port: 8080
  healthcheck:
    # Readiness, not liveness: a container that can't reach its database never receives traffic.
    path: /v1/health/ready
    interval: 3
    timeout: 60

registry:
  server: git.kroshtan.com
  # Packages belong to their owner, so pushing to kroshtan/… takes a kroshtan token scoped to write:package.
  username: kroshtan
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  args:
    # The commit the image is built from, reported by /v1/health as `commit` (CI exports GIT_SHA; by hand it falls
    # back to the checkout's HEAD, which is also the version Kamal tags the image with). Quoted: a SHA such as
    # 1234e567… would otherwise be read as a number.
    GIT_SHA: "<%= ENV.fetch('GIT_SHA') { `git rev-parse HEAD`.strip } %>"
