services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: unfret
      POSTGRES_PASSWORD: unfret
      POSTGRES_DB: unfret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "unfret"]
      interval: 2s
      retries: 15

  backend:
    build: .
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      UNFRET_POSTGRES_URI: postgresql://unfret:unfret@postgres:5432/unfret
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
