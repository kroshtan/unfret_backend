[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "unfret-mcp"
description = "MCP server for Unfret: pay-per-check store scam and dropshipping risk for AI shopping agents (x402, USDC or SOL)"
version = "0.1.0"
authors = [{ name = "Floris van Beers", email = "freelancing@kroshtan.com" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["mcp", "model-context-protocol", "x402", "solana", "scam-detection", "ai-agents", "shopping"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3",
    "solders>=0.29",
]

[project.urls]
Homepage = "https://unfret.net"
Source = "https://git.kroshtan.com/kroshtan/unfret_backend/src/branch/main/mcp"
Mirror = "https://github.com/kroshtan/unfret_backend/tree/main/mcp"
Issues = "https://git.kroshtan.com/kroshtan/unfret_backend/issues"
Changelog = "https://git.kroshtan.com/kroshtan/unfret_backend/src/branch/main/mcp/CHANGELOG.md"

[project.scripts]
unfret-mcp = "unfret_mcp.server:main"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff]
# Inherit the repository rules, but format for the oldest Python this package supports.
extend = "../pyproject.toml"
target-version = "py312"
