[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[project]
name = "unfret"
description = "LLM-powered API that scores e-commerce product pages for scam and dropshipping signals"
version = "0.10.1"
authors = [
    { name = "Floris van Beers", email = "freelancing@kroshtan.com" },
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.14"
classifiers = [
    "Framework :: FastAPI",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

dependencies = [
    "asyncpg>=0.32",
    "beautifulsoup4>=4.15",
    "fastapi>=0.162",
    "httpx>=0.28.1",
    "langchain-openai>=1.7",
    "langgraph>=1.2",
    "pillow>=13.0",
    "pydantic>=2.14",
    "pydantic-settings>=2.12",
    "structlog>=26.1",
    "uvicorn>=0.54",
    "solders>=0.29",
    "segno>=1.6",
    "onnxruntime>=1.31 ; python_full_version < '3.15'",
    "numpy>=2.5",
]

[project.urls]
Repository = "https://github.com/kroshtan/unfret_backend"

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pre-commit>=4.7",
    "pydoclint>=0.12",
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "pytest-env>=1.8",
    "ruff>=0.17",
    "scikit-learn>=1.9.1",
]


[tool.ruff]
line-length = 119
target-version = "py314"

[tool.ruff.lint]
select = [
    # Annotations: missing (return) types
    "ANN",
    # Bugbear: common bug patterns or design problems
    "B",
    # Comprehensions: Write better list/set/dict comprehensions
    "C4",
    # Complexity: McCabe complexity checker
    "C90",
    # Pydocstyle: docstring conventions
    "D",
    # Pycodesyle: Style guide enforcement
    "E",
    # Pyflakes: Source files errors
    "F",
    # Logging format: Basic logging format errors
    "G",
    # Isort: import sorting
    "I",
    # Implicit namespace packages: Check if __init__.py is present
    "INP",
    # Implicit string concatenation
    "ISC",
    # Naming: Variable naming convention
    "N",
    # Perflint: Performance linting
    "PERF",
    # Pylint: enforcing more code standards
    "PL",
    # Refurb: modernize your code
    "FURB",
    # Simplify: Helps simplify your code
    "SIM",
    # Print: Forbid print statements
    "T20",
    # to do: Format to do comments
    "TD",
    # Bandit: security issues
    "S",
    # Blind except: catching Exception needs a reason (noqa with one)
    "BLE",
    # Unused noqa directives
    "RUF100",
    # Ban relative imports
    "TID252",
    # Pyupgrade: Upgrade syntax to newer versions
    "UP",
]

ignore = [
    # Allow Any, allow untyped args and kwargs
    "ANN002", "ANN003", "ANN401",
    # Opinionated pydocstyle rules
    "D100", "D101", "D104", "D106", "D202", "D203", "D212", "D301", "D401", "D413",
    # Allow use of f-string in logging
    "G004",
    # Does not work with Ruff formatter
    "ISC001",
    # Allow to do without author or URL
    "TD002", "TD003",
    # Ignore some aggresive pylint rules
    "PLR0913", "PLR2004"
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    # Unused module imports in __init__.py
    "F401", "F403",
]
"tests/**" = [
    # Tests don't need docstrings, annotations on fixtures, or packages; they assert, and use fake secrets
    "D", "ANN", "INP001", "PLR2004", "S101", "S104", "S105", "S106", "S311", "S603", "S607",
]
"mcp/tests/**" = [
    # Same as tests/
    "D", "ANN", "INP001", "PLR2004", "S101", "S105", "S106", "S311",
]
# Owned by the analysis work (wave B): its RDAP fallback loop is deliberate; it can move into the file there.
"src/unfret/graph/skills/domain_age.py" = ["S112"]
"evals/**" = [
    # Offline evaluation tooling: asserts and seeded sampling are fine there
    "S101", "S311",
]
"scripts/**" = [
    # Standalone CLI scripts
    "INP001", "T20",
]


[tool.ruff.lint.isort]
known-first-party = ["unfret"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["validator", "field_validator"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    # Allow initialization of FastAPI dependencies
    "fastapi.Header",
    "fastapi.Depends",
    "fastapi.Query",
]

[tool.mypy]
exclude = [".git", ".venv"]
ignore_missing_imports = true
disable_error_code = ['import-untyped']
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.pydoclint]
exclude = "scripts|tests"
style = "sphinx"
allow-init-docstring = true
require-return-section-when-returning-nothing = false
check-return-types = false
check-yield-types = false
check-style-mismatch = true
arg-type-hints-in-docstring = false
should-document-star-arguments = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# tests/e2e (the dev sweep, `make e2e`) runs only when asked for: `pytest -m e2e tests/e2e`.
testpaths = ["tests/unit", "tests/integration"]
addopts = [
    "--cov=unfret",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--strict-markers",
    "-rs",  # name every skipped test and why in the summary
    "-m", "not e2e",
]
markers = [
    "e2e: the end-to-end sweep against a deployed dev (real devnet money, secrets; see README 'End-to-end sweep')",
]
env = [
    "UNFRET_LLM_API_KEY=test-key",
]

[tool.coverage.report]
skip_covered = true
exclude_also = [
    "if __name__ == .__main__.:",
    "def __repr__",
    "def __str__",
    "@abstractmethod",
]

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]
