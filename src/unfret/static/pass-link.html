<!doctype html>
<html lang="en">
<head>

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#1f8a70">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Your Unfret pass · Unfret</title>

<body class="app">
  {{header}}
  <main>
    <h1>Your Unfret pass</h1>
    <p>This link puts an Unfret pass on your phone. It opens in the Unfret app when the app is installed, and in the
      <a href="/check">link checker</a> otherwise, which asks before it uses the pass.</p>
    <noscript><p>The link checker needs JavaScript. Turn it on in this browser and scan the code again, or open the
      <a href="/check">link checker</a> and paste your pass there.</p></noscript>
  </main>
  {{footer}}
</body>
